
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌈 彩虹無人機編程學院 — 20 關</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌈🚁 彩虹無人機編程學院</h1>
    <p>20 關飛行冒險｜從起飛到編程大師 🏆</p>
    <div class="progress" id="progress"></div>
    <div class="bar"><div id="barFill"></div></div>
  </header>

  <main class="wrap">
    <section class="panel">
      <h2>🗺️ 我的飛行任務</h2>
      <div class="chips">
        <span class="chip" id="levelTag"></span>
        <span class="chip" id="stepsTag"></span>
        <span class="chip" id="starsTag">⭐ 等待挑戰</span>
      </div>

      <div class="mission">
        <strong id="missionTitle"></strong>
        <div class="concept" id="concept"></div>
        <p id="description"></p>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="img"
             aria-label="無人機飛行地圖"></div>
        <div class="legend">
          🚁 無人機　🏁 降落區　🧱 障礙
          ⚡ 必經點　🅿 起點
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="run">▶️ 執行程式</button>
        <button class="secondary" id="reset">🔄 重設飛行</button>
        <button class="secondary next" id="next" disabled>
          下一關 ➜
        </button>
      </div>

      <div class="status" id="message"
           role="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <h2>🧩 彩色編程工具箱</h2>
      <p class="toolbox-intro">
        點擊指令放進程式。新技能會隨關卡解鎖！
      </p>

      <div class="toolbox" id="palette"></div>

      <div class="subheading">
        <h2>📋 我的程式
          <span id="count" class="program-count"></span>
        </h2>
      </div>

      <div class="program" id="program"></div>

      <div class="small-actions">
        <button id="undo">↩️ 撤銷一步</button>
        <button id="clear">🗑️ 清空程式</button>
      </div>

      <div class="tip">
        <b>💡 飛行小貼士</b>
        <div id="hint"></div>
        <div class="tip-extra">
          ✅ 每關都要：
          <b>🚀 起飛 → 飛行任務 → 🛬 降落</b>
          <div class="tip-note">
            ⚡ 必經點要按順序通過；
            紫色進階指令會逐步解鎖。
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js.js" defer></script>
</body>
</html>
