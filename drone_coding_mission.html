<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🌈 彩虹無人機編程學院 — 20 關</title><style>
:root{--purple:#7253e8;--ink:#293257;--mint:#13bca0;--pink:#ed6aa8;--blue:#438df4;--orange:#f9a837}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:ui-rounded,"Microsoft JhengHei","Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 5% 8%,#ffd9ed,transparent 30%),radial-gradient(circle at 95% 4%,#c7e9ff,transparent 32%),linear-gradient(125deg,#fff7d6,#e0fff2 55%,#f0e5ff);min-height:100vh}button,select,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}header{text-align:center;padding:22px 12px 10px}h1{margin:0;font-size:clamp(25px,4vw,42px);color:#6743d4;text-shadow:2px 3px #fff}header p{font-weight:800;color:#67739a;margin:7px}.wrap{display:grid;grid-template-columns:minmax(320px,1fr) minmax(340px,1fr);gap:18px;max-width:1320px;margin:auto;padding:12px 18px 40px}.panel{background:#ffffffee;border:3px solid #fff;border-radius:25px;padding:19px;box-shadow:0 8px 0 #8a86ba20,0 14px 35px #7771a126}h2{color:#5945b0;font-size:21px;margin:0 0 12px}.chips,.actions,.small-actions{display:flex;gap:8px;flex-wrap:wrap}.chip{font-weight:900;background:#eee8ff;border-radius:30px;padding:8px 12px;color:#6749cc}.chip:nth-child(2){background:#dcfff3;color:#087e69}.chip:nth-child(3){background:#fff0cb;color:#a36b00}.mission{background:#fff4d3;border:2px dashed #ffca59;padding:14px;border-radius:17px;margin:14px 0}.mission strong{color:#b97300;font-size:18px}.mission p{line-height:1.6;margin:6px 0}.concept{font-size:13px;font-weight:900;display:inline-block;border-radius:15px;background:#e9defe;color:#6948b2;padding:5px 10px;margin-top:8px}.board-wrap{max-width:610px;margin:auto;background:#d8f4ff;border:5px solid #b4e8ff;padding:10px;border-radius:24px}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;aspect-ratio:1}.cell{background:#fdfefe;border-radius:10px;border:1px solid #d4e8ed;min-width:0;display:flex;align-items:center;justify-content:center;position:relative;font-size:clamp(15px,2.5vw,29px);box-shadow:inset 0 -3px #cdebe8}.cell:nth-child(even){background:#f5fbff}.cell.wall{background:#ffddd7}.cell.goal{background:#aef0c6;box-shadow:inset 0 0 0 3px #44ca84}.cell.checkpoint{background:#fff0ae}.cell.drone{background:#e2d8ff;box-shadow:inset 0 0 0 3px #9065f0;z-index:1}.cell.start{outline:2px dashed #9582e6;outline-offset:-4px}.cell small{position:absolute;font-size:12px;right:0;bottom:0;background:white;border-radius:7px;line-height:1}.legend{text-align:center;font-size:12px;font-weight:800;color:#687795;margin-top:11px}.actions{margin-top:16px}.actions button,.small-actions button{border:0;font-weight:900;border-radius:13px;padding:12px;box-shadow:0 4px #28235f26}.primary{flex:1;background:#7253e8;color:#fff}.secondary{background:#eae8ff;color:#6551b7}.next{background:#16bca0;color:white}.status{border-radius:14px;background:#eef5ff;border:2px solid #dae6ff;padding:14px;min-height:68px;font-weight:800;line-height:1.55;margin-top:14px}.success{background:#d9fff0;border-color:#79dfb0;color:#07815c}.failure{background:#ffe5e8;border-color:#ffb1b9;color:#ad3346}.toolbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.cmd{background:#4d8bf4;text-align:left;color:white;border:0;padding:11px;border-radius:15px;font-weight:900;box-shadow:0 5px #29335e24}.cmd small{display:block;font-weight:700;font-size:11px;margin-top:3px}.cmd[data-cmd=takeoff]{background:#12af9a}.cmd[data-cmd=land]{background:#ee66a1}.cmd[data-cmd=left],.cmd[data-cmd=right]{background:#f6ac42;color:#593b17}.cmd[data-cmd=repeat]{background:#885ddd}.cmd[data-cmd=setVar],.cmd[data-cmd=addVar],.cmd[data-cmd=forwardVar]{background:#2eb4b2}.cmd[data-cmd=conditional]{background:#e68849}.cmd[data-cmd=define],.cmd[data-cmd=call]{background:#bd6fe2}.cmd[data-cmd=goto]{background:#4e86cf}.program{background:#f8f6ff;border:2px dashed #c9bee9;border-radius:18px;min-height:160px;max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:11px}.block{display:flex;align-items:center;flex-wrap:wrap;gap:6px;background:#548bf0;padding:9px;color:#fff;border-radius:12px;font-weight:900;font-size:14px}.block[data-type=takeoff]{background:#12af9a}.block[data-type=land]{background:#ee66a1}.block[data-type=left],.block[data-type=right]{background:#f5a73c;color:#553b1c}.block[data-type=repeat]{background:#885ddd}.block[data-type=setVar],.block[data-type=addVar],.block[data-type=forwardVar]{background:#20abaa}.block[data-type=conditional]{background:#de8645}.block[data-type=define],.block[data-type=call]{background:#ae65d3}.block[data-type=goto]{background:#4e86cf}.block select{border:0;border-radius:8px;background:#fff;color:#51447c;font-size:13px;font-weight:800;padding:5px;max-width:125px}.delete{border:0;background:#ffffff55;color:inherit;border-radius:8px;font-weight:900;font-size:20px;margin-left:auto;min-width:30px}.placeholder{margin:auto;color:#9386b6;text-align:center;font-weight:900;white-space:pre-line}.small-actions{margin-top:10px}.small-actions button{flex:1;color:#604cb1;background:#ece8ff;padding:10px}.tip{border-left:6px solid #12bca0;background:#e7fff8;border-radius:12px;padding:14px;margin-top:16px;font-size:14px;line-height:1.6}.progress{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:800px;margin:12px auto}.dot{width:32px;height:32px;border-radius:50%;border:0;background:#e7ddff;color:#7156cc;font-weight:900}.dot.active{background:#7452e6;color:white}.dot.passed{background:#13b89b;color:white}.subheading{display:flex;justify-content:space-between;align-items:center;margin:18px 0 9px}.subheading h2{margin:0}.category{grid-column:1/-1;margin:8px 0 0;font-size:12px;color:#70639d;font-weight:900;letter-spacing:.5px}.bar{margin:7px auto 0;max-width:600px;height:10px;border-radius:20px;background:#eee4ff;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#26d9ac,#8661f1);transition:width .3s}@media(max-width:880px){.wrap{grid-template-columns:1fr;max-width:670px}}@media(max-width:420px){.wrap{padding:9px}.panel{padding:12px}.cell{font-size:19px;border-radius:6px}.toolbox{gap:6px}.cmd{font-size:13px}.chip{font-size:12px}}
</style></head><body><header><h1>🌈🚁 彩虹無人機編程學院</h1><p>20 關飛行冒險｜從起飛到編程大師 🏆</p><div class="progress" id="progress"></div><div class="bar"><div id="barFill" style="width:5%"></div></div></header><main class="wrap"><section class="panel"><h2>🗺️ 我的飛行任務</h2><div class="chips"><span class="chip" id="levelTag"></span><span class="chip" id="stepsTag"></span><span class="chip" id="starsTag">⭐ 等待挑戰</span></div><div class="mission"><strong id="missionTitle"></strong><div class="concept" id="concept"></div><p id="description"></p></div><div class="board-wrap"><div class="board" id="board" role="img" aria-label="無人機飛行地圖"></div><div class="legend">🚁 無人機　🏁 降落區　🧱 障礙　⚡ 必經點　🅿 起點</div></div><div class="actions"><button class="primary" id="run">▶️ 執行程式</button><button class="secondary" id="reset">🔄 重設飛行</button><button class="secondary next" id="next" disabled>下一關 ➜</button></div><div class="status" id="message" role="status" aria-live="polite"></div></section><section class="panel"><h2>🧩 彩色編程工具箱</h2><p style="color:#77809e;font-size:14px;font-weight:800">點擊指令放進程式。新技能會隨關卡解鎖！</p><div class="toolbox" id="palette"></div><div class="subheading"><h2>📋 我的程式 <span id="count" style="font-size:13px;color:#9c8dca"></span></h2></div><div class="program" id="program"></div><div class="small-actions"><button id="undo">↩️ 撤銷一步</button><button id="clear">🗑️ 清空程式</button></div><div class="tip"><b>💡 飛行小貼士</b><div id="hint"></div><div style="margin-top:6px">✅ 每關都要：<b>🚀 起飛 → 飛行任務 → 🛬 降落</b><div style="font-size:12px;color:#627b79">⚡ 必經點要按順序通過；紫色進階指令會逐步解鎖。</div></div></div></section></main><script>
'use strict';
const N=8,ARROWS=['⬆','➡','⬇','⬅'];
// Ordered checkpoints make flight paths observable: polygons, zigzags and S flights.
const levels=[
{title:'第一次起飛',concept:'順序執行',start:[1,6,0],goal:[1,3],hint:'起飛 → 前進 3 次 → 降落。',ideal:5},
{title:'向右轉！',concept:'方向控制',start:[1,6,0],goal:[4,4],hint:'向上飛 2 格，右轉，再往右飛 3 格。',ideal:9},
{title:'向左轉！',concept:'方向控制',start:[5,6,0],goal:[2,4],hint:'向上飛 2 格，再左轉往西飛 3 格。',ideal:9},
{title:'閃避障礙',concept:'路徑規劃',start:[1,6,0],goal:[5,4],walls:[[2,6],[2,5],[3,5],[4,5]],hint:'先往上飛到 y=4，再向右走，避開牆壁。',ideal:10},
{title:'收集能量',concept:'順序與除錯',start:[1,6,0],goal:[5,3],points:[[1,3],[5,3]],hint:'先向上通過 ⚡，再轉向右方到達 🏁。',ideal:11},
{title:'迴圈開放！',concept:'Repeat 重複',start:[1,6,1],goal:[6,6],need:'repeat',hint:'新增 🔁 重複！使用「重複 5 次前進」縮短程式。',ideal:3},
{title:'長距離飛行',concept:'迴圈應用',start:[1,6,0],goal:[1,1],need:'repeat',hint:'使用重複 5 次前進，別忘記起飛、降落。',ideal:3},
{title:'正方形巡航',concept:'多邊形・正方形',start:[2,5,1],goal:[2,5],points:[[5,5],[5,2],[2,2]],need:'repeat',hint:'飛 3 格 → 右轉，重複走 4 邊。可以用 🔁 重複積木協助。',ideal:10},
{title:'長方形巡航',concept:'多邊形・長方形',start:[1,5,1],goal:[1,5],points:[[6,5],[6,3],[1,3]],need:'repeat',hint:'依次走右 5、上 2、左 5、下 2 格，經過所有 ⚡。',ideal:12},
{title:'階梯折線',concept:'迴圈與路線',start:[1,6,1],goal:[5,2],points:[[3,6],[3,4],[5,4]],need:'repeat',hint:'沿著「右 → 上 → 右 → 上」路線前進。',ideal:12},
{title:'變數初體驗',concept:'變數設定',start:[1,6,1],goal:[4,6],need:'variable',hint:'設定距離 = 3，再使用「前進距離」指令。',ideal:4},
{title:'改變變數值',concept:'變數運算',start:[1,6,1],goal:[6,6],need:'addVar',hint:'設定距離=2 → 增加距離 3 → 前進距離。',ideal:5},
{title:'變數路線挑戰',concept:'變數與轉向',start:[1,6,0],goal:[5,3],points:[[1,3]],need:'variable',hint:'設定距離=3 往上前進；右轉後改成 4，向右前進。',ideal:9},
{title:'聰明避障',concept:'If / Else 條件判斷',start:[1,6,1],goal:[1,4],walls:[[2,6]],need:'conditional',hint:'先用「如果前方有障礙 → 左轉，否則前進」，再向上飛 2 格。',ideal:5},
{title:'感應器任務',concept:'條件判斷與迴圈',start:[1,6,1],goal:[4,4],walls:[[2,6]],points:[[1,4]],need:'conditional',hint:'先用條件判斷避開右方障礙，然後走到 ⚡ 再轉右飛到終點。',ideal:10},
{title:'函數第一次',concept:'定義與呼叫函數',start:[1,6,1],goal:[5,6],need:'function',hint:'先「定義函數：前進 2 格」，然後起飛，呼叫函數 2 次，降落。',ideal:5},
{title:'函數轉彎',concept:'函數重用',start:[1,6,1],goal:[3,4],points:[[3,6]],need:'function',hint:'定義函數「前進2格」，呼叫一次 → 左轉 → 呼叫一次。',ideal:6},
{title:'座標導航',concept:'X / Y 座標',start:[1,6,0],goal:[5,2],need:'goto',hint:'使用 📍 飛往座標 (5,2)。座標積木會先沿 X 軸，再沿 Y 軸飛行。',ideal:3},
{title:'S 型飛行訓練',concept:'S 型飛行・路線規劃',start:[1,6,0],goal:[6,1],points:[[1,4],[5,4],[5,2],[2,2],[2,1]],need:'repeat',hint:'依次經過 ⚡：向上 → 向右 → 向上 → 向左 → 向上 → 向右。用迴圈簡化直線段。',ideal:19},
{title:'最終挑戰：S 型救援',concept:'綜合：座標・條件・函數・S 型',start:[1,6,0],goal:[6,1],points:[[1,4],[5,4],[5,2],[2,2],[2,1]],walls:[[3,5],[4,5],[3,3],[4,3]],need:'master',hint:'按照 ⚡ 畫出 S 型航線！程式至少要使用一次條件判斷，以及函數或座標指令。',ideal:20}
];
const unlocks={takeoff:1,land:1,forward:1,left:1,right:1,repeat:6,setVar:11,addVar:12,forwardVar:11,conditional:14,define:16,call:16,goto:18};
const metadata={takeoff:['🚀 起飛','開始飛行'],land:['🛬 降落','到達終點後降落'],forward:['⬆️ 前進','沿機頭飛一格'],left:['↶ 左轉 90°','改變機頭方向'],right:['↷ 右轉 90°','改變機頭方向'],repeat:['🔁 重複迴圈','重複指令 n 次'],setVar:['📦 設定變數','設定距離值'],addVar:['➕ 增加變數','距離加上數值'],forwardVar:['🔢 前進距離','使用變數的值'],conditional:['🤔 如果⋯否則','依感應器決定'],define:['🛠️ 定義函數','預先編寫可重用動作'],call:['📣 呼叫函數','執行自訂動作'],goto:['📍 飛往座標','沿 X、Y 軸導航']};
const $=id=>document.getElementById(id),key=(x,y)=>x+','+y,sleep=t=>new Promise(r=>setTimeout(r,t));
let level=0,program=[],state,busy=false,won=false,unlocked=0,completed=new Set();
function initial(){let l=levels[level];return{x:l.start[0],y:l.start[1],dir:l.start[2],airborne:false,landed:false,steps:0,visited:0,distance:0,fn:null}}
function say(message,type=''){$('message').textContent=message;$('message').className='status '+type}
function renderProgress(){let el=$('progress');el.innerHTML='';levels.forEach((_,i)=>{let b=document.createElement('button');b.className='dot'+(i===level?' active':completed.has(i)?' passed':'');b.textContent=completed.has(i)?'✓':i+1;b.title='第 '+(i+1)+' 關';b.disabled=busy||i>unlocked;b.onclick=()=>{level=i;load()};el.append(b)});$('barFill').style.width=((completed.size/20)*100)+'%'}
function renderBoard(){const l=levels[level],wall=new Set((l.walls||[]).map(p=>key(...p))),p=l.points||[];let el=$('board');el.innerHTML='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){let k=key(x,y),c=document.createElement('div');c.className='cell';if(wall.has(k)){c.classList.add('wall');c.textContent='🧱'}let pi=p.findIndex((v,i)=>i>=state.visited&&key(...v)===k);if(pi>=0){c.classList.add('checkpoint');c.textContent='⚡';let n=document.createElement('small');n.textContent=pi+1;c.append(n)}if(x===l.goal[0]&&y===l.goal[1]){c.classList.add('goal');c.textContent='🏁'}if(x===l.start[0]&&y===l.start[1])c.classList.add('start');if(state.x===x&&state.y===y){c.classList.add('drone');c.textContent='🚁';let a=document.createElement('small');a.textContent=ARROWS[state.dir]+(!state.airborne?'🅿':'');c.append(a)}el.append(c)}$('stepsTag').textContent='動作 '+state.steps+'｜⚡ '+state.visited+'/'+p.length}
function select(options,value,onChange){let s=document.createElement('select');options.forEach(([v,t])=>{let o=document.createElement('option');o.value=v;o.textContent=t;s.append(o)});s.value=String(value);s.disabled=busy;s.onchange=()=>onChange(s.value);return s}
const numberOptions=Array.from({length:8},(_,i)=>[String(i+1),String(i+1)]);
const moves=[['forward','⬆️ 前進'],['right','↷ 右轉'],['left','↶ 左轉'],['forwardRight','⬆️前進+右轉'],['forwardLeft','⬆️前進+左轉']];
function renderProgram(){const el=$('program');el.innerHTML='';if(!program.length){let p=document.createElement('div');p.className='placeholder';p.textContent='✨ 先點選「🚀 起飛」\n再編排你的飛行任務！';el.append(p)}program.forEach((cmd,i)=>{let b=document.createElement('div');b.className='block';b.dataset.type=cmd.type;let n=document.createElement('span');n.textContent=(i+1)+'.';b.append(n);let label=document.createElement('span');label.textContent=metadata[cmd.type][0];b.append(label);if(cmd.type==='repeat'){b.append(select(numberOptions,cmd.times,v=>cmd.times=+v));b.append(select(moves,cmd.action,v=>cmd.action=v))}if(cmd.type==='setVar'||cmd.type==='addVar'){b.append(select(Array.from({length:8},(_,i)=>[String(i),String(i)]),cmd.value,v=>cmd.value=+v))}if(cmd.type==='conditional'){b.append(select([['wall','前方有障礙'],['clear','前方無障礙'],['goal','位於降落區']],cmd.condition,v=>cmd.condition=v));b.append('則');b.append(select([['left','左轉'],['right','右轉'],['forward','前進']],cmd.yes,v=>cmd.yes=v));b.append('否則');b.append(select([['left','左轉'],['right','右轉'],['forward','前進'],['none','不動作']],cmd.no,v=>cmd.no=v))}if(cmd.type==='define'){b.append(select([['two','前進 2 格'],['turn','前進 → 左轉 → 前進'],['right','前進 → 右轉 → 前進']],cmd.pattern,v=>cmd.pattern=v))}if(cmd.type==='goto'){b.append('X');b.append(select(Array.from({length:8},(_,i)=>[String(i),String(i)]),cmd.x,v=>cmd.x=+v));b.append('Y');b.append(select(Array.from({length:8},(_,i)=>[String(i),String(i)]),cmd.y,v=>cmd.y=+v))}let del=document.createElement('button');del.className='delete';del.textContent='×';del.title='刪除';del.disabled=busy;del.onclick=()=>{program.splice(i,1);renderProgram()};b.append(del);el.append(b)});$('count').textContent='('+program.length+' 個積木)'}
function renderPalette(){let el=$('palette');el.innerHTML='';let lastGroup='';Object.entries(metadata).forEach(([type,[name,help]])=>{if(unlocks[type]>level+1)return;let group=unlocks[type]<=5?'基本操控':unlocks[type]<=10?'迴圈與圖形':unlocks[type]<=13?'變數':unlocks[type]<=15?'條件判斷':unlocks[type]<=17?'函數':'座標導航';if(group!==lastGroup){let title=document.createElement('div');title.className='category';title.textContent='✨ '+group;el.append(title);lastGroup=group}let b=document.createElement('button');b.className='cmd';b.dataset.cmd=type;b.innerHTML=name+'<small>'+help+'</small>';b.disabled=busy;b.onclick=()=>{program.push(newCommand(type));renderProgram()};el.append(b)})}
function newCommand(type){return {type,...(type==='repeat'?{times:3,action:'forward'}:{}),...(type==='setVar'?{value:3}:{}),...(type==='addVar'?{value:1}:{}),...(type==='conditional'?{condition:'wall',yes:'left',no:'forward'}:{}),...(type==='define'?{pattern:'two'}:{}),...(type==='goto'?{x:5,y:2}:{})}}
function lock(value){busy=value;['run','reset','undo','clear'].forEach(id=>$(id).disabled=value);$('next').disabled=value||!won||level===19;renderPalette();renderProgram();renderProgress()}
function load(){won=false;program=[];state=initial();let l=levels[level];$('levelTag').textContent='關卡 '+(level+1)+' / 20';$('missionTitle').textContent=(level+1)+'. '+l.title;$('concept').textContent='🎓 '+l.concept;$('description').textContent=level<5?'基礎關卡：不使用 Repeat，學習清楚排列飛行步驟。':level<10?'用新學會的 Repeat 積木完成圖形和路線挑戰。':level<13?'運用變數控制無人機的飛行距離。':level<15?'根據感應器資訊作出不同動作。':level<17?'學習寫函數，再重複呼叫它。': '結合不同指令完成更複雜的路線。';$('hint').textContent=l.hint;$('starsTag').textContent='⭐ 等待挑戰';renderBoard();lock(false);say('🌟 選好指令後按「執行程式」。完成 ⚡ 必經點，最後在 🏁 降落！')}
function hasType(type){return program.some(x=>x.type===type)}
function requirement(){const need=levels[level].need;if(need==='repeat'&&!hasType('repeat'))return '這一關要使用至少一個 🔁 重複積木。';if(need==='variable'&&!(hasType('setVar')&&hasType('forwardVar')))return '這關要使用「設定變數」和「前進距離」。';if(need==='addVar'&&!(hasType('setVar')&&hasType('addVar')&&hasType('forwardVar')))return '請使用「設定變數」、「增加變數」和「前進距離」。';if(need==='conditional'&&!hasType('conditional'))return '請加入「如果⋯否則」條件判斷。';if(need==='function'&&!(hasType('define')&&hasType('call')))return '請加入「定義函數」和「呼叫函數」。';if(need==='goto'&&!hasType('goto'))return '請使用「飛往座標」積木。';if(need==='master'&&!(hasType('conditional')&&(hasType('goto')||hasType('call'))))return '最終關需使用「條件判斷」，以及「飛往座標」或「呼叫函數」。';return ''}
function expand(){let out=[];for(const cmd of program){if(cmd.type==='repeat'){for(let i=0;i<cmd.times;i++){if(cmd.action==='forwardRight')out.push({type:'forward'},{type:'right'});else if(cmd.action==='forwardLeft')out.push({type:'forward'},{type:'left'});else out.push({type:cmd.action})}}else out.push({...cmd});if(out.length>160)throw Error('指令太多，請縮短程式。')}return out}
function fail(msg){renderBoard();say('💡 '+msg+' 修改程式再試一次！','failure');lock(false)}
function ahead(){return[state.x+[0,1,0,-1][state.dir],state.y+[-1,0,1,0][state.dir]]}
function blocked(x,y){return x<0||y<0||x>=N||y>=N||(levels[level].walls||[]).some(([a,b])=>a===x&&b===y)}
function visit(){let pts=levels[level].points||[];if(state.visited<pts.length&&state.x===pts[state.visited][0]&&state.y===pts[state.visited][1])state.visited++}
// Deterministic grid simulator; no actual drone hardware access.
async function run(){if(busy)return;if(!program.length){say('請先加入編程積木！','failure');return}let req=requirement();if(req){say('📌 '+req,'failure');return}let actions;try{actions=expand()}catch(e){say(e.message,'failure');return}won=false;state=initial();lock(true);renderBoard();let queue=actions.map(a=>({...a})),executed=0;while(queue.length){if(++executed>180){fail('執行動作太多，請簡化程式！');return}let a=queue.shift();await sleep(160);state.steps++;if(a.type==='define'){if(state.airborne){fail('請在起飛前定義函數。');return}state.fn=a.pattern==='two'?['forward','forward']:a.pattern==='turn'?['forward','left','forward']:['forward','right','forward'];renderBoard();continue}if(a.type==='setVar'){state.distance=a.value;renderBoard();continue}if(a.type==='addVar'){state.distance+=a.value;renderBoard();continue}if(a.type==='takeoff'){if(state.airborne||state.landed){fail('起飛次序不正確。');return}state.airborne=true}else if(a.type==='land'){let l=levels[level];if(!state.airborne){fail('無人機未起飛，不能降落！');return}if(state.x!==l.goal[0]||state.y!==l.goal[1]){fail('還未到 🏁 降落區！');return}if(state.visited!==(l.points||[]).length){fail('尚未依次完成所有 ⚡ 必經點！');return}if(queue.length){fail('降落後不可以再執行其他指令！');return}state.airborne=false;state.landed=true}else{if(!state.airborne){fail('必須先使用 🚀 起飛，才能操控無人機！');return}if(a.type==='conditional'){let [x,y]=ahead(),yes=a.condition==='wall'?blocked(x,y):a.condition==='clear'?!blocked(x,y):state.x===levels[level].goal[0]&&state.y===levels[level].goal[1];let next=yes?a.yes:a.no;if(next!=='none')queue.unshift({type:next});}else if(a.type==='forwardVar'){if(!Number.isInteger(state.distance)||state.distance<1||state.distance>16){fail('變數「距離」必須是 1 至 16！');return}queue.unshift(...Array.from({length:state.distance},()=>({type:'forward'})))}else if(a.type==='call'){if(!state.fn){fail('必須先定義函數！');return}queue.unshift(...state.fn.map(type=>({type})))}else if(a.type==='goto'){let path=[];let dx=a.x-state.x,dy=a.y-state.y;const d1=dx>=0?1:3,d2=dy>=0?2:0;let curr=state.dir;for(const [direction,length] of [[d1,Math.abs(dx)],[d2,Math.abs(dy)]]){if(!length)continue;while(curr!==direction){path.push({type:'right'});curr=(curr+1)%4}for(let n=0;n<length;n++)path.push({type:'forward'})}queue.unshift(...path)}else if(a.type==='left')state.dir=(state.dir+3)%4;else if(a.type==='right')state.dir=(state.dir+1)%4;else if(a.type==='forward'){let [x,y]=ahead();if(blocked(x,y)){fail('撞到 🧱 障礙，或飛出地圖了！');return}state.x=x;state.y=y;visit()}else{fail('無法辨識指令！');return}}renderBoard()}if(!state.landed){fail('程式結束了，但還未在終點 🛬 降落！');return}won=true;completed.add(level);unlocked=Math.max(unlocked,Math.min(19,level+1));let l=levels[level],stars=program.length<=l.ideal?3:program.length<=l.ideal+4?2:1;$('starsTag').textContent='⭐'.repeat(stars)+' '+stars+'/3';say(level===19?'🏆 恭喜成為彩虹無人機編程大師！20 關挑戰完成！':'🎉 完成任務！成功起飛、經過所有必經點並安全降落！用了 '+program.length+' 個積木、'+state.steps+' 個動作。','success');lock(false)}
$('run').onclick=run;$('reset').onclick=()=>{if(busy)return;state=initial();renderBoard();say('🔄 飛行位置已重設，程式保留，可再次執行。')};$('undo').onclick=()=>{if(!busy){program.pop();renderProgram()}};$('clear').onclick=()=>{if(!busy){program=[];renderProgram()}};$('next').onclick=()=>{if(won&&level<19){level++;load()}};load();
</script></body></html>
